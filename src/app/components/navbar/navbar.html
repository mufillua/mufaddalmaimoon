<header class="nav" [class.is-scrolled]="scrolled()" [class.is-open]="menuOpen()">
  <div class="container nav__inner">
    <a class="brand" href="#home" (click)="closeMenu()" aria-label="Mufaddal Maimoon — back to top">
      <img class="brand__mark" src="assets/images/mm-mark.png" width="104" height="104" alt="MM logo" />
      <span class="brand__text">
        <span class="brand__name">{{ contact.name }}</span>
        <span class="brand__role">{{ contact.role }}</span>
      </span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      <ul>
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="'#' + link.id"
              [class.is-active]="active() === link.id"
              [attr.aria-current]="active() === link.id ? 'true' : null"
            >{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="nav__actions">
      <a class="btn btn--primary nav__cta" href="#contact">Get a Quote</a>

      <button
        #toggle
        type="button"
        class="nav__toggle"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMenu()"
      >
        <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="drawer" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
    <nav class="container drawer__inner" aria-label="Mobile">
      <ul>
        @for (link of links; track link.id; let i = $index) {
          <li [style.--i]="i">
            <a [href]="'#' + link.id" (click)="closeMenu()" [class.is-active]="active() === link.id">
              {{ link.label }}
              <app-icon name="arrow-right" size="18" />
            </a>
          </li>
        }
      </ul>
      <a class="btn btn--primary btn--block" href="#contact" (click)="closeMenu()">Get a Website Quote</a>
      <p class="drawer__meta">
        <a href="tel:+{{ contact.phoneIntl }}"><app-icon name="phone" size="16" />{{ contact.phoneDisplay }}</a>
        <a href="mailto:{{ contact.email }}"><app-icon name="mail" size="16" />{{ contact.email }}</a>
      </p>
    </nav>
  </div>
</header>
<div class="scrim" [class.is-open]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>
